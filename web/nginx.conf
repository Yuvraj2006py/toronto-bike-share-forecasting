server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits MapLibre's worker as .mjs; browsers reject module workers
    # served as application/octet-stream (nginx's default for unknown types).
    types {
        application/javascript js mjs;
        text/css css;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
        text/html html;
    }
    default_type application/octet-stream;

    # SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the prediction API so the browser stays same-origin
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|mjs|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
